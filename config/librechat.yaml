# Maivoc free-first endpoint overlay, LibreChat v0.8.8 / config 1.3.17
version: 1.3.17
cache: true

endpoints:
  # Built-in Google Gemini models come from GOOGLE_MODELS in runtime .env.
  custom:
    # Default is the free-model router, not a paid catalog entry.
    - name: "OpenRouter"
      apiKey: "user_provided"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["openrouter/free"]
        fetch: false
      dropParams: ["stop"]
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "OpenRouter · Free · Limits apply"

    - name: "Groq"
      apiKey: "user_provided"
      baseURL: "https://api.groq.com/openai/v1/"
      models:
        default: ["openai/gpt-oss-20b"]
        fetch: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Groq · Free · Limits apply"

    # Ollama is opt-in with: docker compose --profile local-model up -d ollama
    # No Ollama port is published externally.
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1/"
      models:
        default: ["qwen3:4b"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Ollama · Local · Private"
