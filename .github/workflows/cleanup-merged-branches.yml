# One-time, reviewed cleanup for branches already merged in Maivoc.
# This workflow triggers only when this file is introduced/modified on main.
# It checks each exact PR's merged status, repository and head SHA before deletion.
name: One-time cleanup of merged Maivoc branches
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"
permissions:
  contents: write
jobs:
  cleanup-merged-branches:
    if: github.repository == 'bzenny/maivoc'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only reviewed, merged and unchanged branch heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["REPO"]
          # Review-locked map: PR number -> merged branch name.
          # Do not turn this into dynamic "delete every merged branch" behavior.
          targets = {
              1: "feat/free-first-foundation",
              8: "feat/m4-branding",
              9: "fix/remove-inert-gemini-yaml",
              12: "fix/brand-reversed-lockup",
              13: "feat/m5-runtime-ci",
              14: "docs/mvp-readiness-review4",
              15: "fix/m5-scheduler-guard",
          }

          def gh_json(route: str):
              p = subprocess.run(["gh", "api", route], text=True,
                                 capture_output=True)
              if p.returncode:
                  return None
              return json.loads(p.stdout)

          for number, branch in targets.items():
              pr = gh_json(f"repos/{repo}/pulls/{number}")
              if not pr:
                  raise SystemExit(f"Cannot inspect PR #{number}; refusing deletion")
              if (not pr.get("merged_at") or pr.get("head", {}).get("ref") != branch
                      or (pr.get("head", {}).get("repo") or {}).get("full_name") != repo):
                  raise SystemExit(f"PR #{number} is not an eligible merged same-repo branch")
              if branch in ("main", "master"):
                  raise SystemExit("Refusing to delete a default branch")
              ref = gh_json(f"repos/{repo}/git/ref/heads/{branch}")
              if ref is None:
                  print(f"SKIP: {branch} already absent")
                  continue
              if ref.get("object", {}).get("sha") != pr["head"]["sha"]:
                  raise SystemExit(f"Ref {branch} advanced since review; refusing deletion")
              result = subprocess.run(
                  ["gh", "api", "-X", "DELETE", f"repos/{repo}/git/refs/heads/{branch}"],
                  text=True, capture_output=True
              )
              if result.returncode:
                  raise SystemExit(f"Deletion rejected for {branch} (API status check required)")
              print(f"DELETED merged branch: {branch} (PR #{number})")
          PY
