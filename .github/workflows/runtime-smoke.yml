name: M5 — LibreChat runtime smoke test
on:
  pull_request:
    paths:
      - "config/**"
      - "scripts/**"
      - "assets/branding/**"
      - ".github/workflows/runtime-smoke.yml"
      - "docs/ACCEPTANCE.md"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "assets/branding/**"
      - ".github/workflows/runtime-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install static schema checker
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate own config, brand and log-guard unit tests
        run: |
          python scripts/validate.py
          python scripts/verify_brand_assets.py
          python -m unittest discover -s scripts -p 'test_m5_log_guard_unit.py' -v
      - name: Bootstrap pinned LibreChat without keys
        run: bash scripts/bootstrap.sh
      - name: Start actual pinned services
        run: |
          cd upstream/LibreChat
          docker compose config -q
          docker compose up -d --pull missing
      - name: Verify startup, assets, endpoint order, trust labels and auth
        run: python -u scripts/test_m5_runtime.py
      - name: Bounded container diagnostics on failure
        if: failure()
        run: |
          cd upstream/LibreChat
          docker compose ps || true
          # Print matching error *categories* only; never publish raw app logs,
          # .env contents, API keys, user messages or auth tokens.
          python3 - <<'PY'
          import subprocess
          for service in ("mongodb", "meilisearch", "api"):
              p = subprocess.run(["docker", "compose", "logs", "--no-color", "--tail", "120", service], capture_output=True, text=True)
              output = (p.stdout + p.stderr).lower()
              markers = {"permissions":"permission denied" in output or "operation not permitted" in output,
                         "readiness":"not ready" in output, "fatal":"fatal" in output or "failed to start" in output}
              print(service, markers, "log_available=", p.returncode == 0)
          PY
      - name: Destroy temporary data and services
        if: always()
        run: |
          if [ -f upstream/LibreChat/docker-compose.yml ]; then
            cd upstream/LibreChat
            docker compose down -v --remove-orphans || true
          fi
  # Must stay independent of the passing smoke job: prove our own guard
  # rejects a real running LibreChat whose scheduler setting is removed.
  scheduler-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Reproduce reported failure by deleting bootstrap setting
        run: |
          sed -i '/"SCHEDULES_SINGLE_PROCESS":"true"/d' scripts/bootstrap.sh
          if grep -q 'SCHEDULES_SINGLE_PROCESS' scripts/bootstrap.sh; then
            echo "Unexpected scheduler setting remains in test bootstrap"
            exit 1
          fi
          bash scripts/bootstrap.sh
          if grep -q '^SCHEDULES_SINGLE_PROCESS=' upstream/LibreChat/.env; then
            echo "Negative test failed to remove scheduler setting"
            exit 1
          fi
      - name: Start real scheduler-disabled LibreChat
        run: |
          cd upstream/LibreChat
          docker compose up -d --pull missing
      - name: Prove live scheduler failure makes check_logs fail
        run: python -u scripts/test_m5_scheduler_regression.py
      - name: Sanitized container status on failure
        if: failure()
        run: |
          cd upstream/LibreChat
          docker compose ps || true
      - name: Destroy temporary services
        if: always()
        run: |
          if [ -f upstream/LibreChat/docker-compose.yml ]; then
            cd upstream/LibreChat
            docker compose down -v --remove-orphans || true
          fi
