name: Validate Maivoc overlay
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate shell syntax
        run: bash -n scripts/bootstrap.sh
      - name: Validate config invariants
        run: python scripts/validate.py
