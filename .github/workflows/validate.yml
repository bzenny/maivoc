name: Validate Maivoc overlay
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  static-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install minimal YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate shell syntax
        run: bash -n scripts/bootstrap.sh
      - name: Validate config invariants
        run: python scripts/validate.py
      - name: Validate checked-in brand PNGs and PWA manifest
        run: python scripts/verify_brand_assets.py
      - name: Guard against known LibreChat scheduler failures
        run: python -m unittest discover -s scripts -p 'test_m5_log_guard_unit.py' -v
