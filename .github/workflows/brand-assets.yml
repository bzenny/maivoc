name: Generate Maivoc branded PNG assets
on:
  push:
    branches: ["feat/**", "fix/**"]
    paths:
      - "assets/branding/*.svg"
      - "assets/branding/pwa/manifest.webmanifest"
      - "scripts/build_brand_assets.py"
      - ".github/workflows/brand-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    # GitHub write token is NEVER used on main, even on manual dispatch.
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned image render dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.8.2
      - name: Render brand PNGs
        run: python scripts/build_brand_assets.py
      - name: Verify PNGs and manifest
        run: python scripts/verify_brand_assets.py
      - name: Commit generated binaries to current feature branch
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main|master) echo "Refusing binary commit on protected/default branch"; exit 1 ;;
            feat/*|fix/*) ;;
            *) echo "Only feature/fix branches may receive generated assets"; exit 1 ;;
          esac
          git add assets/branding/maivoc-mark.png assets/branding/maivoc-lockup.png assets/branding/maivoc-lockup-reversed.png assets/branding/pwa/*.png
          if git diff --cached --quiet; then
            echo "Brand assets unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(brand): render connected-M PNG and PWA icon assets"
          # A human/agent may have committed while images rendered. Bring our
          # generated-image commit onto the newest feature-branch head.
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
